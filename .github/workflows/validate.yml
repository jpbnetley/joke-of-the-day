name: Run tests

on:
  workflow_dispatch:

  pull_request:
    branches: ['dev', 'main']

env:
  node_version: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        command: ['lint','test', 'typescript:check']

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ env.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.node_version }}
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm run ${{ matrix.command }}